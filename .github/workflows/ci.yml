name: 'Run App Al Mahmoud, Salah'

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build
        run: dotnet build

      - name: Run unit tests
        run: dotnet test --logger "console;verbosity=normal"